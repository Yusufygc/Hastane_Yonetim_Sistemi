# API'yi de container'da çalıştırır (PostgreSQL + Mailpit ile birlikte). docker-compose.yml'in ÜSTÜNE biner:
#
#   cp .env.example .env        # değerleri düzenleyin (gizli anahtarları üretin)
#   docker compose -f docker-compose.yml -f docker-compose.app.yml up -d --build
#   # API:    http://localhost:8080   (sağlık: /health, dokümantasyon: /scalar/v1)
#   # Mailpit http://localhost:8025
#
# Zorunlu değişkenler .env'de yoksa compose açık hata verir (güvensiz varsayılanla başlamaz).
services:
  api:
    build: .
    image: hospital-api:local
    container_name: hospital-api
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-hospital};Username=${POSTGRES_USER:-hospital};Password=${POSTGRES_PASSWORD:-hospital_dev}"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY zorunlu (en az 32 karakter; bkz. .env.example)}"
      Security__DataProtection__Key: "${DATA_PROTECTION_KEY:?DATA_PROTECTION_KEY zorunlu (Base64, 32 bayt: openssl rand -base64 32)}"
      Seed__SuperAdmin__Email: "${SEED_ADMIN_EMAIL:?SEED_ADMIN_EMAIL zorunlu}"
      Seed__SuperAdmin__Password: "${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD zorunlu}"
      Seed__SampleData: "${SEED_SAMPLE_DATA:-false}"
      Seed__SampleDoctor__Email: "${SEED_SAMPLE_DOCTOR_EMAIL:-}"
      Seed__SampleDoctor__Password: "${SEED_SAMPLE_DOCTOR_PASSWORD:-}"
      Database__MigrateOnStartup: "true"
      Database__SeedOnStartup: "true"
      Email__Smtp__Host: mailpit
      Email__Smtp__Port: "1025"
      Email__Smtp__Security: None
      RateLimiting__Auth__PermitLimit: "${AUTH_RATE_LIMIT:-10}"
      OpenApi__Enabled: "${OPENAPI_ENABLED:-true}"
      Cors__AllowedOrigins__0: "${CORS_ORIGIN:-http://localhost:5173}"
    healthcheck:
      # aspnet imajında curl yok; bash'in /dev/tcp'si ile /health'e (veritabanı denetimi dahil) HTTP isteği atılır.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
