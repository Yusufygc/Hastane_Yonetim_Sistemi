# Güvenlik başlıkları. nginx'te bir location içinde add_header varsa üst düzeydekiler devralınmaz; bu yüzden her location bu dosyayı include eder.
#
# CSP notları: three.js/React Three Fiber tuvale satır içi stil yazar (style-src 'unsafe-inline'); betikler yalnız aynı origin'den;
# API aynı origin (/api) olduğundan connect-src 'self' yeterli.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
