name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    # Entegrasyon testleri gerçek PostgreSQL (geçici veritabanı açar/siler) ve gerçek SMTP için Mailpit kullanır.
    services:
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hospital
          POSTGRES_PASSWORD: hospital_dev
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hospital"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Hospital.sln

      - name: Build
        run: dotnet build Hospital.sln --no-restore -c Release

      - name: Test
        run: dotnet test Hospital.sln --no-build -c Release

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test

      # Tipler dondurulmuş sözleşmeden (docs/api/openapi.v1.json) üretilir; elle değiştirilmiş/eski dosya burada fark edilir.
      - name: API tipleri güncel mi
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts

      - run: npm run build

      # Üretim imajı (nginx) derlenebiliyor mu? (yalnız derleme; yayımlanmaz)
      - name: Web imajı derlenir
        working-directory: .
        run: docker build -t hospital-web web
